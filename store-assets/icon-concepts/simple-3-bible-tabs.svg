<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Direct nod to original Bible Tabs sky-blue background (#E2F5FF) -->
  <rect width="1024" height="1024" fill="#E2F5FF"/>

  <!-- Two simple index tabs peeking cleanly from the right edge -->
  <rect x="676" y="290" width="128" height="156" rx="36" fill="#60A5FA"/>
  <rect x="676" y="484" width="128" height="156" rx="36" fill="#93C5FD"/>

  <!-- Simple bold cobalt Bible book (#0A58CA) -->
  <rect x="224" y="196" width="504" height="632" rx="64" fill="#0A58CA"/>

  <!-- Clean white cross centered on the cover -->
  <rect x="448" y="346" width="56" height="332" rx="28" fill="#FFFFFF"/>
  <rect x="364" y="434" width="224" height="56" rx="28" fill="#FFFFFF"/>
</svg>

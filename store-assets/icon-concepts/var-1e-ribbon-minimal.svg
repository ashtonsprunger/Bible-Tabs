  <path d="M490 436 C436 404 338 394 238 404 L238 704 C338 694 436 704 490 736 Z" fill="url(#leftPageShade)"/>
  <path d="M534 436 C588 404 686 394 786 404 L786 704 C686 694 588 704 534 736 Z" fill="url(#rightPageShade)"/>

  <!-- Clean swallowtail Bible bookmark ribbon on the right page -->

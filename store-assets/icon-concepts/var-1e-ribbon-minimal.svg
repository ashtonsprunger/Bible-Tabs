  <path d="M512 398 C452 358 336 346 218 358 Q190 362 190 390 L190 730 Q190 758 218 754 C336 740 446 752 512 796 C578 752 688 740 806 754 Q834 758 834 730 L834 390 Q834 362 806 358 C688 346 572 358 512 398 Z" fill="#0A58CA"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skySoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECF8FF"/>
      <stop offset="100%" stop-color="#D4EEFF"/>
    </linearGradient>
    <linearGradient id="leftPageShade" x1="78%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F2FF"/>
    </linearGradient>
    <linearGradient id="rightPageShade" x1="0%" y1="0%" x2="22%" y2="0%">
      <stop offset="0%" stop-color="#E6F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Soft sky-blue original palette background -->
  <rect width="1024" height="1024" fill="url(#skySoft)"/>

  <!-- Two sleek, well-proportioned top browser tabs -->
  <rect x="256" y="250" width="218" height="154" rx="34" fill="#0A58CA"/>
  <rect x="528" y="270" width="218" height="136" rx="34" fill="#60A5FA"/>

